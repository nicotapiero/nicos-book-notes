<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Highlights Renderer</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
      background: #fafafa;
      color: #222;
    }

    h1 {
      margin-bottom: 16px;
    }

    h3 {
      margin-top: 40px;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 260px;
      font-family: monospace;
      font-size: 14px;
      padding: 12px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
      margin-right: 8px;
    }

    .error {
      color: red;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }

    .meta {
      color: #666;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-bottom: 24px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      vertical-align: top;
      text-align: left;
    }

    th {
      background: #f3f3f3;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .note {
      white-space: pre-wrap;
    }

    .empty-state {
      color: #666;
      font-style: italic;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>Book Highlights Renderer</h1>

  <textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea>

  <div>
    <button id="renderBtn">Render</button>
    <button id="copyBtn" style="display:none">Copy All for Sheets</button>
    <button id="copyNotedBtn" style="display:none">Copy Noted for Sheets</button>
  </div>

  <div id="error" class="error"></div>

  <div id="output"></div>

  <script>
    const renderBtn = document.getElementById("renderBtn");
    const copyBtn = document.getElementById("copyBtn");
    const copyNotedBtn = document.getElementById("copyNotedBtn");
    const jsonInput = document.getElementById("jsonInput");
    const output = document.getElementById("output");
    const errorBox = document.getElementById("error");

    let currentBook = null;

    function tsvCell(str) {
      const cleaned = (str || "").replace(/\r\n/g, "\n").replace(/\n/g, "\n\n");
      return `"${cleaned.replace(/"/g, '""')}"`;
    }

    function copyEntries(entries, btn, label) {
      const rows = entries.map(entry => `${tsvCell(entry.text)}\t${tsvCell(entry.note)}`);
      const tsv = rows.join("\n");
      navigator.clipboard.writeText(tsv).then(() => {
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = label, 2000);
      }).catch(() => {
        errorBox.textContent = "Failed to copy to clipboard.";
      });
    }

    renderBtn.addEventListener("click", () => {
      errorBox.textContent = "";
      output.innerHTML = "";
      copyBtn.style.display = "none";
      copyNotedBtn.style.display = "none";
      currentBook = null;

      try {
        const data = JSON.parse(jsonInput.value);

        if (!Array.isArray(data.entries)) {
          throw new Error("JSON must contain an 'entries' array.");
        }

        currentBook = data;
        renderBook(data);
        copyBtn.style.display = "inline";

        const hasNoted = data.entries.some(e => e.note && e.note.trim() !== "");
        if (hasNoted) copyNotedBtn.style.display = "inline";

      } catch (err) {
        errorBox.textContent = "Invalid JSON:\n" + err.message;
      }
    });

    copyBtn.addEventListener("click", () => {
      if (!currentBook) return;
      copyEntries(currentBook.entries, copyBtn, "Copy All for Sheets");
    });

    copyNotedBtn.addEventListener("click", () => {
      if (!currentBook) return;
      const noted = currentBook.entries.filter(e => e.note && e.note.trim() !== "");
      copyEntries(noted, copyNotedBtn, "Copy Noted for Sheets");
    });

    function renderBook(book) {

      // All entries
      const rows = book.entries.map(entry => {
        const escapedText = (entry.text || "")
          .split("\n")
          .map(line => escapeHtml(line))
          .join("<br><br>");
        return `
          <tr>
            <td>${escapedText}</td>
            <td class="note">${entry.note ? escapeHtml(entry.note) : ""}</td>
          </tr>
        `;
      }).join("");

      // Entries with notes only
      const notedEntries = book.entries.filter(entry =>
        entry.note &&
        entry.note.trim() !== ""
      );

      const notedRows = notedEntries.map(entry => {
        const escapedText = (entry.text || "")
          .split("\n")
          .map(line => escapeHtml(line))
          .join("<br><br>");
        return `
          <tr>
            <td>${escapedText}</td>
            <td class="note">${escapeHtml(entry.note)}</td>
          </tr>
        `;
      }).join("");

      output.innerHTML = `
        <h2>${escapeHtml(book.title || "Untitled")}</h2>

        <div class="meta">
          ${escapeHtml(book.author || "Unknown Author")}
        </div>

        <h3>All Highlights</h3>

        <table>
          <thead>
            <tr>
              <th style="width: 75%">Text</th>
              <th style="width: 25%">Note</th>
            </tr>
          </thead>

          <tbody>
            ${rows}
          </tbody>
        </table>

        <h3>Highlights With Notes</h3>

        ${
          notedEntries.length > 0
            ? `
              <table>
                <thead>
                  <tr>
                    <th style="width: 75%">Text</th>
                    <th style="width: 25%">Note</th>
                  </tr>
                </thead>

                <tbody>
                  ${notedRows}
                </tbody>
              </table>
            `
            : `
              <div class="empty-state">
                No highlights contain notes.
              </div>
            `
        }
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
